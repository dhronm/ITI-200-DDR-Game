        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="css/style.css">

    </head>
    <body>
        <!-- This is the navbar -->
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container-fluid d-flex align-items-center justify-content-start ps-4">
                <a class="navbar-brand" href="#">
                <!-- logo is here -->
                <img src="/img/logo.png" alt="Arrow Storm" width="75" height="75">
                </a>
                <!-- navbar options we can change these as needed for now
                     I just made home, play, and Leaderboard -->
                <ul class="navbar-nav flex-row">
                <li class="nav-item me-3">
                    <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item me-3">
                    <a class="nav-link" href="game.html">Play</a>
                </li>
                <li class="nav-item me-3">
                    <a class="nav-link active"  href="#">Leaderboard</a>
                </li>
                </ul>
                <!-- Sign in logo im not sure how you do a pop up
                     card for gettin user info for sign in but im sure
                     we dont need that implemteded at the moment and 
                     we can ask thiago -->
                <button id="signin-btn" class="ms-auto">
                    <a href="#" class="text-white ms-auto">
                    <i class="bi bi-person-circle fs-3"></i>
                    </a>
                </button>
            </div>
        </nav>

        <div class="container mt-5">
            <h1 class="text-center text-white mb-4">Leaderboard</h1>
            <div class="table-responsive">
                <table class="table table-striped table-bordered">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col">Rank</th>
                            <th scope="col">Player</th>
                            <th scope="col">Score</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        <script src="signIn.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

        <script>
          document.addEventListener("DOMContentLoaded", async () => {
            const tbody = document.querySelector("table tbody");
            tbody.innerHTML = "";

            try {
              // AJAX GET to backend (JSON)
              const response = await fetch("/api/leaderboard");
              if (!response.ok) throw new Error("Failed to load leaderboard");
              const data = await response.json();

              if (data.length === 0) {
                const tr = document.createElement("tr");
                const td = document.createElement("td");
                td.colSpan = 3;
                td.classList.add("text-center");
                td.textContent = "No scores yet. Play a game to get on the board!";
                tr.appendChild(td);
                tbody.appendChild(tr);
                return;
              }

              data.forEach((entry, index) => {
                const tr = document.createElement("tr");

                const rankTh = document.createElement("th");
                rankTh.scope = "row";
                rankTh.textContent = index + 1;

                const nameTd = document.createElement("td");
                nameTd.textContent = entry.username;

                const scoreTd = document.createElement("td");
                scoreTd.textContent = entry.score;

                if (window.playerName && entry.username === window.playerName) {
                  tr.classList.add("table-primary");
                }

                tr.appendChild(rankTh);
                tr.appendChild(nameTd);
                tr.appendChild(scoreTd);
                tbody.appendChild(tr);
              });
            } catch (err) {
              console.error(err);
              const tr = document.createElement("tr");
              const td = document.createElement("td");
              td.colSpan = 3;
              td.classList.add("text-center");
              td.textContent = "Error loading leaderboard.";
              tr.appendChild(td);
              tbody.appendChild(tr);
            }
          });
        </script>

        <footer class="mt-5 py-3 bg-dark text-white text-center">
            <div class="container">
                <p class="mb-0">&copy; 2025 Arrow Storm</p>
                 <small>Built with HTML, CSS, Bootstrap, Node.js, and PostgreSQL</small>
            </div>
        </footer>

    </body>
</html>
